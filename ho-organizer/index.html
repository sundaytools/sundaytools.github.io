<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面已迁移 · HO位整理表</title>
<link rel="canonical" href="https://sundaytools.github.io/ho/" />
<meta name="robots" content="noindex" />
<meta http-equiv="refresh" content="0; url=/ho/" />
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:#f6f1e9;color:#3f342c;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    text-align:center;line-height:1.8;
  }
  p{font-size:14px;color:#8c7b6c}
  a{color:#b4554a;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <p>这个地址已迁移到 <a href="/ho/">sundaytools.github.io/ho</a>，正在跳转…</p>
  <script>
    (function(){
      var to = "/ho/" + location.search + location.hash;
      location.replace(to);
      setTimeout(function(){
        var a = document.querySelector("a");
        if(a) a.href = to;
      }, 50);
    })();
  </script>
</body>
</html>
